services:
  plage:
    image: ghcr.io/wedgemaster/plage:main
    ports:
      - "${PLAGE_PORT:-8100}:${PLAGE_PORT:-8100}"
    environment:
      - PLAGE_PORT=${PLAGE_PORT:-8100}
      - PLAGE_HOST=0.0.0.0
      - PLAGE_CONNECTIONS=/app/connections.json
    volumes:
      # Mount connections file (create from connections.example.json)
      - ./connections.json:/app/connections.json:ro
    restart: unless-stopped
